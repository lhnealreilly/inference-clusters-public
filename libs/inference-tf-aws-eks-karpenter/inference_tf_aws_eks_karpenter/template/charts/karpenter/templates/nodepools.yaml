{{- /*
NodePools (karpenter.sh/v1). On-demand, except the gated gpu-spot test pool.
  - cpu:   CPU inference / batch. c/m/r families, amd64.
  - gpu-g: default GPU (A10G/L4). g-families, GPU taint so only GPU-tolerating
           inference pods land; label inference/accelerator for chart targeting.
  - gpu-p: high-end GPU (A100/H100/H200), gated. g-pool's twin but with a DISTINCT
           taint (inference/accelerator=nvidia-p) on top of the shared GPU taint, so
           P requires explicit opt-in on both label + toleration — cost-safe by
           default (a generic GPU pod falls to gpu-g, never provisions a P node).
  - gpu-spot: short tests on Spot, gated. Every g + p family on the gpu NodeClass,
           capacity-type spot only; taint + label inference/capacity=spot so only a pod
           that opts in (toleration + capacity-type=spot selector) lands there.
Auto Mode (autoMode.enabled): the same pools, labels, taints and limits, on the
eks.amazonaws.com/v1 NodeClasses (cpu, gpu — gpu-p shares gpu), with
eks.amazonaws.com/* requirement keys, expireAfter within Auto Mode's 21-day cap, a 1h
terminationGracePeriod, families Auto Mode does not support dropped, and GPU pools
consolidated only when empty with a Drifted: 0 budget (a weekly AMI release never rolls
a running GPU node). karpenter.sh/capacity-type stays pinned on every pool (unset, Auto
Mode prefers reserved, then spot, then on-demand).
*/ -}}
{{- $auto := .Values.autoMode.enabled }}
{{- $keyPrefix := ternary "eks.amazonaws.com" "karpenter.k8s.aws" $auto }}
{{- $classGroup := ternary "eks.amazonaws.com" "karpenter.k8s.aws" $auto }}
{{- $classKind := ternary "NodeClass" "EC2NodeClass" $auto }}
{{- $expireAfter := ternary .Values.autoMode.expireAfter .Values.expireAfter $auto }}
{{- $gpuGFamilies := .Values.gpuG.instanceFamilies }}
{{- $gpuPFamilies := .Values.gpuP.instanceFamilies }}
{{- if $auto }}
{{- range .Values.autoMode.unsupportedFamilies }}
{{- $gpuGFamilies = without $gpuGFamilies . }}
{{- $gpuPFamilies = without $gpuPFamilies . }}
{{- end }}
{{- end }}
{{- if .Values.cpu.enabled }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cpu
spec:
  template:
    spec:
      nodeClassRef:
        group: {{ $classGroup }}
        kind: {{ $classKind }}
        name: cpu
      expireAfter: {{ $expireAfter }}
      {{- if $auto }}
      terminationGracePeriod: {{ .Values.autoMode.terminationGracePeriod }}
      {{- end }}
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: {{ $keyPrefix }}/instance-category
          operator: In
          values: {{ .Values.cpu.instanceFamilies | toJson }}
        - key: {{ $keyPrefix }}/instance-generation
          operator: Gt
          values: ["{{ .Values.cpu.instanceGeneration }}"]
  # Authoritative capacity cap for the CPU pool. This is the single source of
  # truth for CPU/memory capacity — Kueue's ClusterQueue nominalQuota is derived
  # from the SAME Terraform values (platform_kueue.tf), so Kueue never admits more
  # than Karpenter will provision, and the two cannot drift.
  limits:
    cpu: {{ .Values.cpu.cpuLimit }}
    memory: {{ .Values.cpu.memoryLimit }}
  disruption:
    consolidationPolicy: {{ .Values.consolidationPolicy }}
    consolidateAfter: 1m
{{- end }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-g
spec:
  template:
    metadata:
      labels:
        inference/accelerator: nvidia-g
    spec:
      nodeClassRef:
        group: {{ $classGroup }}
        kind: {{ $classKind }}
        name: gpu
      expireAfter: {{ $expireAfter }}
      {{- if $auto }}
      terminationGracePeriod: {{ .Values.autoMode.terminationGracePeriod }}
      {{- end }}
      taints:
        - key: nvidia.com/gpu
          value: "present"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: {{ $keyPrefix }}/instance-family
          operator: In
          values: {{ $gpuGFamilies | toJson }}
  # Authoritative GPU cap for the g-tier pool. Kueue's gpu-g flavor nominalQuota
  # (nvidia.com/gpu AND vpc.amazonaws.com/efa) is derived from this SAME value.
  limits:
    nvidia.com/gpu: {{ .Values.gpuG.gpuLimit }}
  disruption:
    consolidationPolicy: {{ ternary "WhenEmpty" .Values.consolidationPolicy $auto }}
    consolidateAfter: 1m
    {{- if $auto }}
    budgets:
      {{- toYaml .Values.autoMode.gpuDisruptionBudgets | nindent 6 }}
    {{- end }}
{{- if .Values.gpuP.enabled }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-p
spec:
  template:
    metadata:
      labels:
        inference/accelerator: nvidia-p
    spec:
      nodeClassRef:
        group: {{ $classGroup }}
        kind: {{ $classKind }}
        name: {{ ternary "gpu" "gpu-p" $auto }}
      expireAfter: {{ $expireAfter }}
      {{- if $auto }}
      terminationGracePeriod: {{ .Values.autoMode.terminationGracePeriod }}
      {{- end }}
      taints:
        # Shared GPU taint (keeps non-GPU pods off) + a DISTINCT high-tier taint so a
        # pod reaches P only by tolerating BOTH — an under-specified GPU pod is repelled
        # here and falls to gpu-g, so the expensive node is never grabbed/provisioned
        # by accident. The taint key MUST differ from the label key
        # (inference/accelerator): a key that is both a label and a taint breaks
        # Karpenter's scheduling simulation ("label does not have known values",
        # so the tier taint is inference/gpu-tier=high, not the label.
        - key: nvidia.com/gpu
          value: "present"
          effect: NoSchedule
        - key: inference/gpu-tier
          value: "high"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: {{ $keyPrefix }}/instance-family
          operator: In
          values: {{ $gpuPFamilies | toJson }}
  # Authoritative GPU cap for the high-tier P pool. Kueue's gpu-multinode flavor
  # nominalQuota is derived from this SAME value.
  limits:
    nvidia.com/gpu: {{ .Values.gpuP.gpuLimit }}
  disruption:
    consolidationPolicy: {{ ternary "WhenEmpty" .Values.consolidationPolicy $auto }}
    consolidateAfter: 1m
    {{- if $auto }}
    budgets:
      {{- toYaml .Values.autoMode.gpuDisruptionBudgets | nindent 6 }}
    {{- end }}
{{- end }}
{{- if .Values.gpuSpot.enabled }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-spot
spec:
  template:
    metadata:
      labels:
        inference/capacity: spot
    spec:
      nodeClassRef:
        group: {{ $classGroup }}
        kind: {{ $classKind }}
        name: gpu
      expireAfter: {{ $expireAfter }}
      {{- if $auto }}
      terminationGracePeriod: {{ .Values.autoMode.terminationGracePeriod }}
      {{- end }}
      taints:
        # Shared GPU taint + a DISTINCT capacity taint: a pod reaches Spot only by
        # tolerating BOTH (and selecting karpenter.sh/capacity-type=spot). The label
        # inference/capacity=spot lets tools see Spot nodes without the Karpenter label.
        - key: nvidia.com/gpu
          value: "present"
          effect: NoSchedule
        - key: inference/capacity
          value: "spot"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: {{ $keyPrefix }}/instance-family
          operator: In
          values: {{ concat $gpuGFamilies $gpuPFamilies | toJson }}
  # A small cap: the pool is for short tests (template var gpu_spot_capacity).
  limits:
    nvidia.com/gpu: {{ .Values.gpuSpot.gpuLimit }}
  disruption:
    # Only empty nodes are consolidated: a running test is never moved to save money
    # (it is interrupted by AWS at most); an empty Spot node goes away after consolidateAfter.
    consolidationPolicy: WhenEmpty
    consolidateAfter: {{ .Values.gpuSpot.consolidateAfter }}
    {{- if $auto }}
    budgets:
      {{- toYaml .Values.autoMode.gpuDisruptionBudgets | nindent 6 }}
    {{- end }}
{{- end }}
