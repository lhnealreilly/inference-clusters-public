{{- /*
One llm-d Endpoint Picker (EPP) + InferencePool per scheduler. The pool selects the model
pods labeled `<schedulerLabel>: <name>` in this namespace; the EPP scores them on queue
depth, KV-cache utilization and prefix-cache affinity, scraping each pod's /metrics.
Modeled on the llm-d-router v1.0.0 chart (routerlib), trimmed to the InferencePool path.
EPP metrics (/metrics on metricsPort, unauthenticated) carry both the GIE names
(inference_objective_*, inference_pool_*) and llm_d_epp_*.
*/ -}}
{{- range .Values.schedulers }}
{{- $epp := printf "%s-epp" .name }}
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  targetPorts:
    - number: {{ .targetPort | default 8000 }}
  selector:
    matchLabels:
      {{ $.Values.schedulerLabel }}: {{ .name | quote }}
  endpointPickerRef:
    name: {{ $epp }}
    port:
      number: {{ $.Values.epp.grpcPort }}
    failureMode: {{ $.Values.epp.failureMode }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $epp }}
  namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $epp }}
  namespace: {{ $.Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "watch", "list"]
  # Optional CRDs the EPP discovers at start-up (llm-d.ai in v1.0; the alpha GIE group
  # vendored in charts/inference-extension).
  - apiGroups: ["llm-d.ai", "inference.networking.x-k8s.io"]
    resources: ["inferenceobjectives", "inferencemodelrewrites"]
    verbs: ["get", "watch", "list"]
  # Leader election (harmless with one replica).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $epp }}
  namespace: {{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $epp }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $epp }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $epp }}
  namespace: {{ $.Release.Namespace }}
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $epp }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    inference/component: epp
    inference/scheduler: {{ .name | quote }}
  ports:
    - name: grpc-ext-proc
      protocol: TCP
      port: {{ $.Values.epp.grpcPort }}
      appProtocol: kubernetes.io/h2c
    - name: http-metrics
      protocol: TCP
      port: {{ $.Values.epp.metricsPort }}
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $epp }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ $.Values.epp.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      inference/component: epp
      inference/scheduler: {{ .name | quote }}
  template:
    metadata:
      labels:
        inference/component: epp
        inference/scheduler: {{ .name | quote }}
    spec:
      serviceAccountName: {{ $epp }}
      terminationGracePeriodSeconds: 130
      {{- include "inference-gateway.placement" $ | nindent 6 }}
      containers:
        - name: epp
          image: {{ $.Values.epp.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --pool-name
            - {{ .name | quote }}
            - --pool-namespace
            - {{ $.Release.Namespace | quote }}
            - --pool-group
            - "inference.networking.k8s.io"
            - --zap-encoder
            - "json"
            - --v
            - {{ $.Values.epp.logVerbosity | quote }}
            - --config-file
            - "/config/default-plugins.yaml"
            - --grpc-port
            - {{ $.Values.epp.grpcPort | quote }}
            - --grpc-health-port
            - {{ $.Values.epp.grpcHealthPort | quote }}
            - --metrics-port
            - {{ $.Values.epp.metricsPort | quote }}
            - --tracing=false
            - --metrics-endpoint-auth=false
          ports:
            - name: grpc
              containerPort: {{ $.Values.epp.grpcPort }}
            - name: grpc-health
              containerPort: {{ $.Values.epp.grpcHealthPort }}
            - name: metrics
              containerPort: {{ $.Values.epp.metricsPort }}
          livenessProbe:
            grpc:
              port: {{ $.Values.epp.grpcHealthPort }}
              service: liveness
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: {{ $.Values.epp.grpcHealthPort }}
              service: readiness
            periodSeconds: 2
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- with $.Values.podDefaults.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: plugins-config
              mountPath: /config
      volumes:
        - name: plugins-config
          configMap:
            name: {{ $epp }}
---
{{- end }}
