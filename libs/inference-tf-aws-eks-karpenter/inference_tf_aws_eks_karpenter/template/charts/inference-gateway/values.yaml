# Injected from Terraform (platform_inference_gateway.tf). Defaults are placeholders so
# `helm template` renders standalone for linting / unit tests.

# -- Gateway name. Also the prefix of the PodMonitors (<gatewayName>-epp / -bbr), whose
#    Prometheus `job` label is <namespace>/<podmonitor name> — keep `inference-gateway`
#    so job = inference/inference-gateway-{epp,bbr}, the names the HyperPod gateway used.
gatewayName: inference-gateway

# -- GatewayClass (cluster-scoped) owned by this release; Envoy Gateway's controller.
gatewayClassName: inference-gateway
controllerName: gateway.envoyproxy.io/gatewayclass-controller

# -- Pod label a model Deployment carries to be routed by a scheduler: a pod labeled
#    `<schedulerLabel>: <scheduler name>` joins that scheduler's InferencePool. Same
#    contract as the HyperPod gateway and the KRO starter's gatewayScheduler field.
schedulerLabel: inference/gateway-scheduler

# -- One llm-d Endpoint Picker + InferencePool per entry. `modelName` is matched against
#    the OpenAI body `model` field (BBR copies it into bbr.modelHeader), so the model
#    server must serve under exactly that name (vLLM --served-model-name).
schedulers:
  - name: default
    modelName: default
    targetPort: 8000

# -- Request timeout on every route (long generations).
requestTimeout: 300s

# -- Envoy data plane (Envoy Gateway runs it in THIS namespace: GatewayNamespace mode).
envoy:
  # -- Full image ref (vendored into ECR from docker.io).
  image: docker.io/envoyproxy/envoy:distroless-v1.39.5
  replicas: 1
  # -- ClusterIP = in-VPC/in-cluster only. On Auto Mode an internal NLB is
  #    `LoadBalancer` + loadBalancerClass eks.amazonaws.com/nlb (no LBC needed).
  serviceType: ClusterIP
  loadBalancerClass: ""
  serviceAnnotations: {}
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 1Gi}

# -- llm-d Endpoint Picker.
epp:
  image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0
  replicas: 1
  grpcPort: 9002
  grpcHealthPort: 9003
  metricsPort: 9090
  # -- Envoy -> EPP ext_proc is TLS (the AI Gateway InferencePool cluster speaks TLS
  #    with no verification; the EPP serves a self-signed cert by default).
  failureMode: FailClose
  logVerbosity: 2

# -- GIE body-based router: copies the OpenAI body `model` into modelHeader so the
#    HTTPRoute can pick the scheduler's InferencePool.
bbr:
  image: registry.k8s.io/gateway-api-inference-extension/bbr:v1.5.0
  replicas: 1
  port: 9004
  healthCheckPort: 9005
  metricsPort: 9090
  modelHeader: X-Gateway-Model-Name
  messageTimeout: 5s

# -- Placement + sizing for Envoy, EPP and BBR pods (the tainted system node group).
podDefaults:
  nodeSelector: {}
  tolerations: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}

# -- Labels the kube-prometheus-stack Prometheus selects ServiceMonitors/PodMonitors by.
serviceMonitorLabel:
  release: kube-prometheus-stack

scrape:
  enabled: true
  interval: 15s

# -- sha256 of the chart's files; presence forces a helm upgrade when a template changes.
chartContentHash: ""
